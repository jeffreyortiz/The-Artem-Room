<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio — Tattoo, Piercing, Nails, Makeup, Hair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG-DRIVEN TEMPLATE
     ============================================================ */

  :root {
    --deep-pink:   #490413; /* Your dark red */
    --light-pink:  #FF91C5;
    --pale-pink:   #FFF7FC;
    --beige-trans: #ECE4D6cc;
    --burgundy:    #A8175E;

    /* Service accents */
    --c-tattoo:   #7E93A7;
    --c-piercing: #C7BFB2;
    --c-nails:    #C1485B;
    --c-makeup:   #D6A24C;
    --c-hair:     #A97452;

    /* Global Font */
    --grenze: 'Grenze Gotisch', cursive;

    --nav-h: 60px;
    --edge: 20px;

    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    scroll-padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
    overflow-x: hidden;
    width: 100%;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  body {
    margin: 0;
    background: var(--deep-pink);
    color: var(--pale-pink);
    font-family: var(--grenze);
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
    width: 100%;
    position: relative;
    font-size: 1.1rem;
  }

  /* ---------- background layer ---------- */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    background-image: url('photos/5-Photoroom.png'); 
    opacity: .25; 
  }

  a { color: inherit; }
  img { max-width: 100%; display: block; }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding-left: var(--edge);
    padding-right: var(--edge);
  }

  /* ---------- top nav ---------- */
  .nav {
    position: sticky;
    top: 0;
    top: env(safe-area-inset-top, 0px);
    z-index: 50;
    height: var(--nav-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    
    /* Fixed RGBA to match #490413 (73, 4, 19) */
    background: rgba(73, 4, 19, 0.86); 
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--light-pink);
    padding: 0 var(--edge);
  }
  .nav-brand {
    font-family: var(--grenze);
    font-size: 1.4rem;
    letter-spacing: 0.01em;
    font-weight: 600;
  }
  .nav-links {
    display: none;
    gap: 28px;
    font-size: 1.1rem;
  }
  .nav-links a {
    text-decoration: none;
    color: var(--beige-trans);
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .nav-links a:hover, .nav-links a:focus-visible { color: var(--pale-pink); border-color: var(--burgundy); }
  
  .nav-cta {
    font-family: var(--grenze);
    font-size: 1.1rem;
    font-weight: 600;
    background: var(--pale-pink);
    color: var(--deep-pink);
    border: none;
    padding: 8px 16px;
    border-radius: 3px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-cta:hover { opacity: 0.88; }

  @media (min-width: 860px) {
    .nav-links { display: flex; }
  }

  /* ---------- hero carousel ---------- */
  .hero {
    position: relative;
    width: 100%;
    overflow: hidden; 
  }
  .carousel {
    display: flex;
    width: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    height: 78vh;
    min-height: 420px;
    max-height: 720px;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .slide {
    flex: 0 0 100%;
    width: 100%;
    min-width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    position: relative;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .slide-art {
    position: absolute;
    inset: 0;
  }
  .slide-art svg { width: 100%; height: 100%; }
  
  .slide-shade {
    position: absolute;
    inset: 0;
    /* Fixed RGBA to match #490413 (73, 4, 19) */
    background: linear-gradient(180deg, rgba(73,4,19,0) 35%, rgba(73,4,19,0.95) 100%);
  }
  
  .slide-copy {
    position: relative;
    padding: 0 var(--edge) 40px;
    width: 100%;
  }
  .slide-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1rem;
    color: var(--beige-trans);
    margin-bottom: 6px;
  }
  .slide-swatch {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .slide-title {
    font-family: var(--grenze);
    font-weight: 600;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    line-height: 1.02;
    margin: 0 0 8px;
  }
  .slide-tag {
    font-size: 1.15rem;
    color: var(--pale-pink);
    max-width: 34ch;
    margin: 0;
  }

  .carousel-controls {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    pointer-events: none;
  }
  .carousel-btn {
    pointer-events: auto;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--light-pink);
    background: var(--burgundy); 
    backdrop-filter: blur(6px);
    color: var(--pale-pink);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.5rem;
    line-height: 1;
  }
  .carousel-btn:hover { background: var(--deep-pink); }
  @media (min-width: 640px) {
    .carousel-btn { display: flex; }
  }

  .dots {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 3;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--burgundy); 
    border: none;
    padding: 0;
    cursor: pointer;
    transition: background 0.2s ease, width 0.2s ease;
  }
  .dot.active { background: var(--pale-pink); width: 20px; border-radius: 4px; }

  /* ---------- quick nav chips ---------- */
  .chipbar {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 18px var(--edge) 6px;
    scrollbar-width: none;
  }
  .chipbar::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 1rem;
    padding: 8px 14px;
    border: 1px solid var(--light-pink);
    border-radius: 30px;
    text-decoration: none;
    color: var(--beige-trans);
  }
  .chip .swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .chip:hover, .chip:focus-visible { color: var(--pale-pink); border-color: var(--burgundy); }

  /* ---------- service sections ---------- */
  .services { padding: 20px 0 10px; }

  .service {
    scroll-margin-top: calc(var(--nav-h) + 12px);
    padding: 56px var(--edge);
    border-top: 1px solid var(--light-pink);
    display: grid;
    gap: 22px;
  }
  .service-visual {
    aspect-ratio: 4 / 3;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    background-color: var(--burgundy); /* solid color fallback while image loads */
  }
  .service-visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .service-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .service-swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
  .service-name {
    font-family: var(--grenze);
    font-size: clamp(2rem, 4vw, 2.8rem);
    font-weight: 600;
    margin: 0;
  }
  .service-desc {
    color: var(--beige-trans);
    line-height: 1.6;
    max-width: 52ch;
    margin: 0 0 18px;
  }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .badge {
    font-size: 0.9rem;
    color: var(--beige-trans);
    border: 1px solid var(--light-pink);
    border-radius: 4px;
    padding: 5px 10px;
  }

  .service-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn {
    font-family: var(--grenze);
    font-size: 1.2rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 3px;
    text-decoration: none;
    display: inline-block;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-solid { background: var(--pale-pink); color: var(--deep-pink); }
  .btn-solid:hover { opacity: 0.88; }
  .btn-outline { background: transparent; color: var(--pale-pink); border-color: var(--light-pink); }
  .btn-outline:hover { border-color: var(--burgundy); }

  @media (min-width: 860px) {
    .service {
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 56px;
      padding: 72px var(--edge);
    }
    .service:nth-of-type(even) .service-visual { order: 2; }
  }

  /* ---------- booking placeholder panel ---------- */
  .booking-panel {
    margin: 40px var(--edge) 0;
    border: 1px dashed var(--light-pink);
    border-radius: 8px;
    padding: 28px;
    max-width: 1180px;
    margin-left: auto;
    margin-right: auto;
  }
  .booking-panel h3 {
    font-family: var(--grenze);
    font-weight: 600;
    margin: 0 0 8px;
    font-size: 1.8rem;
  }
  .booking-panel p { color: var(--beige-trans); line-height: 1.6; margin: 0; max-width: 60ch; }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--light-pink);
    padding: 40px var(--edge) calc(40px + env(safe-area-inset-bottom, 0px));
    margin-top: 60px;
    color: var(--pale-pink);
    font-size: 1rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  footer .foot-brand { font-family: var(--grenze); color: var(--pale-pink); font-size: 1.5rem; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>

<nav class="nav">
  <div class="nav-brand" id="brand-name">Studio</div>
  <div class="nav-links" id="nav-links"></div>
  <a class="nav-cta" href="#contact">Get in touch</a>
</nav>

<div class="hero">
  <div class="carousel" id="carousel"></div>
  <div class="carousel-controls">
    <button class="carousel-btn" id="prevBtn" aria-label="Previous service">‹</button>
    <button class="carousel-btn" id="nextBtn" aria-label="Next service">›</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<div class="chipbar" id="chipbar"></div>

<main class="services" id="services"></main>

<div class="booking-panel">
  <h3>Booking coming soon</h3>
  <p>This is a portfolio preview — booking isn't wired up yet. In the meantime, reach out directly below and we'll get you sorted.</p>
</div>

<footer id="contact">
  <div class="foot-brand" id="foot-brand">Studio</div>
  <div id="foot-addr">123 Main Street · Your City</div>
  <div id="foot-contact">hello@yourstudio.com · (000) 000-0000</div>
</footer>

<script>
/* ================================================================
   BUSINESS CONFIG — ADD YOUR PICTURES HERE
   ================================================================ */
const BUSINESS = {
  name: "Studio", 
  address: "123 Main Street · Your City",
  contact: "theartemroom@gmail.com · (786) 694-3553",
  services: [
    {
      id: "tattooing",
      name: "Tattooing",
      image: "YOUR_TATTOO_PHOTO.jpg", /* <--- PUT YOUR IMAGE FILE NAME HERE */
      tag: "Fine line patchwork, with a heavy focus on optimal placement",
      desc: "Every piece starts as a conversation. Share references and placement, and we'll sketch a custom design ahead of your session.",
      color: "var(--c-tattoo)"
    },
    {
      id: "piercing",
      name: "Piercing",
      image: "YOUR_PIERCING_PHOTO.jpg", /* <--- PUT YOUR IMAGE FILE NAME HERE */
      tag: "Ear curation, facial & body piercing, implant-grade jewelry",
      desc: "A quick consult confirms placement and jewelry before we book your slot — most piercings are same-week.",
      color: "var(--c-piercing)"
    },
    {
      id: "nails",
      name: "Nails",
      image: "YOUR_NAILS_PHOTO.jpg", /* <--- PUT YOUR IMAGE FILE NAME HERE */
      tag: "Manicure, gel, and hand-painted nail art",
      desc: "Pick a time that works and come as you are — no consultation needed for standard sets.",
      color: "var(--c-nails)"
    },
    {
      id: "makeup",
      name: "Makeup",
      image: "YOUR_MAKEUP_PHOTO.jpg", /* <--- PUT YOUR IMAGE FILE NAME HERE */
      tag: "Editorial, event & bridal makeup",
      desc: "Single sessions book directly. Bridal and large events get a short consult first to plan trials and timing.",
      color: "var(--c-makeup)"
    },
    {
      id: "hair",
      name: "Hair",
      image: "photos\IMG_4493.png", /* <--- PUT YOUR IMAGE FILE NAME HERE */
      tag: "Cut, color & styling",
      desc: "Choose your service and time — straightforward booking, no forms required.",
      color: "var(--c-hair)"
    }
  ]
};

/* ---------- render ---------- */
document.getElementById('brand-name').textContent = BUSINESS.name;
document.getElementById('foot-brand').textContent = BUSINESS.name;
document.getElementById('foot-addr').textContent = BUSINESS.address;
document.getElementById('foot-contact').textContent = BUSINESS.contact;

const carousel = document.getElementById('carousel');
const dotsWrap = document.getElementById('dots');
const chipbar = document.getElementById('chipbar');
const navLinks = document.getElementById('nav-links');
const servicesWrap = document.getElementById('services');

BUSINESS.services.forEach((svc, i) => {
  // --- CAROUSEL SLIDE ---
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.style.setProperty('--accent', svc.color);
  slide.innerHTML = `
    <div class="slide-art">
      <img src="${svc.image}" alt="${svc.name}" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <div class="slide-shade"></div>
    <div class="slide-copy">
      <div class="slide-eyebrow"><span class="slide-swatch"></span>${i + 1} of ${BUSINESS.services.length}</div>
      <h1 class="slide-title">${svc.name}</h1>
      <p class="slide-tag">${svc.tag}</p>
    </div>`;
  carousel.appendChild(slide);

  // --- NAVIGATION DOTS & CHIPS ---
  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', `Go to ${svc.name}`);
  dot.addEventListener('click', () => scrollToSlide(i));
  dotsWrap.appendChild(dot);

  const chip = document.createElement('a');
  chip.className = 'chip';
  chip.href = `#${svc.id}`;
  chip.style.setProperty('--accent', svc.color);
  chip.innerHTML = `<span class="swatch"></span>${svc.name}`;
  chipbar.appendChild(chip);

  const nl = document.createElement('a');
  nl.href = `#${svc.id}`;
  nl.textContent = svc.name;
  navLinks.appendChild(nl);

  // --- SERVICE SECTIONS ---
  const section = document.createElement('section');
  section.className = 'service';
  section.id = svc.id;

  section.innerHTML = `
    <div class="service-visual">
      <img src="${svc.image}" alt="${svc.name}">
    </div>
    <div class="service-content">
      <div class="service-head">
        <span class="service-swatch" style="background:${svc.color}"></span>
        <h2 class="service-name">${svc.name}</h2>
      </div>
      <p class="service-desc">${svc.desc}</p>
      <div class="service-actions">
        <a class="btn btn-solid" href="#contact">Inquire</a>
      </div>
    </div>`;
  servicesWrap.appendChild(section);
});

/* ---------- carousel behavior ---------- */
const slides = Array.from(carousel.children);
const dots = Array.from(dotsWrap.children);

function scrollToSlide(i) {
  slides[i].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
}

document.getElementById('prevBtn').addEventListener('click', () => {
  const i = Math.max(0, currentIndex() - 1);
  scrollToSlide(i);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const i = Math.min(slides.length - 1, currentIndex() + 1);
  scrollToSlide(i);
});

function currentIndex() {
  const w = carousel.clientWidth;
  return Math.round(carousel.scrollLeft / w);
}

let ticking = false;
carousel.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const idx = currentIndex();
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    ticking = false;
  });
});
</script>
</body>
</html>
